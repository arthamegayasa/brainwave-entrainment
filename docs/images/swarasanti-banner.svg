<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">SwaraSanti — An audio instrument for quiet moments</title>
  <desc id="desc">Original imagined dawn over still water, with a soft sun beyond distant hills. Decorative landscape, not measured brain activity.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#0e1b29"/><stop offset=".63" stop-color="#3a5863"/><stop offset="1" stop-color="#bb9383"/></linearGradient>
    <linearGradient id="sea" x2="0" y2="1"><stop stop-color="#7f9495"/><stop offset=".22" stop-color="#314e59"/><stop offset="1" stop-color="#102735"/></linearGradient>
    <linearGradient id="shade"><stop stop-color="#091825" stop-opacity=".96"/><stop offset=".68" stop-color="#10212e" stop-opacity=".76"/><stop offset="1" stop-color="#10212e" stop-opacity="0"/></linearGradient>
    <radialGradient id="bloom" gradientUnits="userSpaceOnUse" cx="1010" cy="115" r="255"><stop stop-color="#efc3a6" stop-opacity=".65"/><stop offset=".5" stop-color="#efc3a6" stop-opacity=".2"/><stop offset="1" stop-color="#efc3a6" stop-opacity="0"/></radialGradient>
    <radialGradient id="sun" cx=".32" cy=".3" r=".8"><stop stop-color="#fff8e9"/><stop offset=".7" stop-color="#f5dfc7"/><stop offset="1" stop-color="#e3b8aa" stop-opacity=".42"/></radialGradient>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#sky)"/>
  <rect width="1280" height="360" rx="24" fill="url(#bloom)"/>
  <circle cx="1010" cy="115" r="91" fill="url(#sun)"/>
  <path d="M0 254 C157 249 233 214 351 233 S566 270 687 244 S849 189 965 231 S1170 263 1280 221 L1280 360 L0 360Z" fill="#355460"/>
  <path d="M0 258 Q640 253 1280 260 L1280 360 L0 360Z" fill="url(#sea)"/>
  <path d="M0 260 Q640 253 1280 261" fill="none" stroke="#f4dbc4" stroke-opacity=".43" stroke-width="2"/>
  <path d="M818 289 Q1018 284 1180 289 M887 310 Q1021 307 1140 310 M746 330 Q1040 325 1202 330" fill="none" stroke="#f4d5c0" stroke-opacity=".2" stroke-width="2" stroke-linecap="round"/>
  <path d="M0 287 C88 268 147 254 219 247 C134 270 87 318 0 333Z M1280 279 C1198 264 1141 247 1090 242 C1168 271 1207 314 1280 335Z" fill="#122a36"/>
  <rect width="940" height="360" fill="url(#shade)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <circle cx="67" cy="59" r="5" fill="#56d0b4"/>
    <text x="84" y="65" fill="#e5d2bd" font-size="13" letter-spacing="3">SOUND FOR WHERE YOU WANT TO BE</text>
    <text x="61" y="165" fill="#f5f3ed" font-family="Georgia, 'Times New Roman', serif" font-size="78">SwaraSanti</text>
    <text x="65" y="213" fill="#f0d9c2" font-size="22">Find your quiet horizon.</text>
    <text x="65" y="258" fill="#c1d0d1" font-size="16">Choose a goal. Shape the sound. Listen at your own pace.</text>
    <text x="65" y="322" fill="#9db2b6" font-size="12" letter-spacing="2">REAL-TIME AUDIO   /   LAYERED STUDIO   /   BROWSER FIRST</text>
  </g>
</svg>
